# Declarative software definition: single source of truth for what gets
# installed and at which version.
#
# Two lists, and (except for Raspbian's legacy set) a tool appears in at most
# one of them. CI enforces that for debian and arch.
#
#   packages:  distro package manager (apt/pacman)
#   mise:      mise-managed tools (release artifacts, pinned versions)
#
# Put a tool under packages: when it needs system integration (login shell,
# terminfo, daemons, PAM, /etc files), sits in a prompt hot path, or is a
# security primitive whose distro backports matter (git, curl).
# Everything else that ships release binaries belongs under mise:.

mise:
  # How mise-managed tools are exposed. One-line switch:
  #   user    -> all tools live in ~/.local/share/mise, reached via shims only
  #   hybrid  -> tools named in global_tools are ALSO symlinked as real
  #              binaries into global_link_dir (no shim overhead, visible to
  #              scripts, systemd, sudo and GUI apps); the rest stay shim-only
  #   all     -> every mise tool is symlinked into global_link_dir
  #
  # Note: mise's own `install --system` is intentionally not used. core:go
  # rejects it ("automatic system installation currently supports
  # binary-download backends only" on mise 2026.11.2), and symlinking the
  # user-store binaries gives the same global visibility without needing
  # /etc/mise/config.toml.
  install_mode: hybrid

  # hybrid only: tools symlinked into global_link_dir. These are the ones
  # invoked from build scripts, editors, CI helpers and other contexts that
  # never see mise's shims.
  global_tools:
    - go

  # Where the global symlinks are written (must be on the default PATH).
  global_link_dir: /usr/local/bin

  # Pinned tool versions. "latest" tracks upstream for a single tool.
  # Backend-prefixed keys are allowed when a tool is not in mise's named
  # registry (e.g. "aqua:cilium/cilium-cli", which ships a `cilium` binary).
  tools:
    go: "1.27.3"
    neovim: "0.12.6"
    fzf: "0.74.5"
    kubectl: "1.37.2"
    kind: "0.33.0"
    helm: "4.3.1"
    kubectx: "0.11.0"   # kubens is declared separately below
    oh-my-posh: "31.3.0"
    uv: "0.12.23"
    "aqua:cilium/cilium-cli": "0.20.2"
    # --- service/cluster ops tooling ---------------------------------------
    # Tier 0: used constantly when debugging Go services and their clusters.
    istioctl: "1.31.4"
    kubebuilder: "4.16.0"
    yq: "4.54.2"                       # aqua:mikefarah/yq
    "aqua:fortio/fortio": "1.76.0"     # not in mise's named registry
    # Tier 1
    grpcurl: "1.9.4"
    crane: "0.22.1"                    # aqua:google/go-containerregistry
    k9s: "0.51.0"
    stern: "1.35.0"
    "aqua:go-delve/delve": "1.27.2"    # provides `dlv`
    golangci-lint: "2.15.0"
    kubens: "0.11.0"                   # kubectx above ships kubectx only
    krew: "0.5.0"
    # Tier 2
    pluto: "5.24.5"
    kubeconform: "0.8.0"
    kube-score: "1.20.0"
    trivy: "0.76.2"
    sloth: "0.12.0"
    # Rust goes through mise's rustup backend. The table form is required here:
    # the minimal profile has no rust-analyzer, and without the component the
    # rustup proxy in ~/.cargo/bin ("unavailable for the active toolchain")
    # falls back to mise's shim for the same name and recurses.
    # Cost with this profile/components: ~750 MB in ~/.rustup.
    rust:
      version: "1.97.0"
      profile: minimal
      components:
        - rust-analyzer   # LazyVim's lang.rust / rustaceanvim
        - rust-src        # go-to-definition into std
        - rustfmt         # BufWritePre autocmd in lua/config/autocmds.lua
        - clippy          # rust-analyzer "check on save"

packages:
  # apt-get list (Ubuntu, Debian and derivatives)
  debian:
    - fish
    - tmux
    - git
    - curl
    - powerline
    - direnv
    - kitty-terminfo
    # ops / load testing (names differ from Arch below)
    - conntrack        # package name is `conntrack`, not conntrack-tools
    - socat
    - stress-ng
    - iperf3
    - hping3
    - tree
    # host diagnostics
    - btop
    - htop
    - ncdu
    - fio
    - tcpdump
    - mtr-tiny         # text-only mtr
    - iftop
    - nmap
    - lsof
    - strace
    - iotop
    - sysstat          # sar, iostat, mpstat
    - iproute2         # ip, ss
    - procps           # ps, vmstat, top
    - util-linux       # dmesg
    - bpftrace
    - linux-tools-common    # perf wrapper
    - linux-tools-generic   # kernel-specific perf binaries
  # pacman list (Arch)
  arch:
    - fish
    - tmux
    - git
    - curl
    - powerline
    - kitty-terminfo
    - direnv
    - conntrack-tools
    - socat
    - stress-ng
    - iperf3
    - hping            # provides the `hping3` binary
    - tree
    - btop
    - htop
    - ncdu
    - fio
    - tcpdump
    - mtr
    - iftop
    - nmap
    - lsof
    - strace
    - iotop
    - sysstat
    - iproute2
    - procps-ng
    - util-linux
    - bpftrace
    - perf
  # Raspbian: lighter, vim-only setup (no mise-managed tools there)
  raspbian:
    - fish
    - tmux
    - vim
    - git
    - curl
    - fzf
    - direnv
#
# Deliberately NOT declared: docker. It comes from Docker's own apt repository
# (docker-ce, containerd.io, buildx/compose plugins, a systemd service and the
# docker group). Installing distro `docker.io` here would replace that setup,
# and mise cannot manage a daemon.
