# vim: ft=tmux

# common config
if-shell "test -f ~/.tmux.conf.common" "source ~/.tmux.conf.common"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
# Seamless <C-h/j/k/l> between tmux panes and nvim splits (nvim side is the
# christoomey/vim-tmux-navigator spec in lua/plugins/editor.lua).
set -g @plugin 'christoomey/vim-tmux-navigator'

run-shell "powerline-daemon -q"
run-shell "powerline-config tmux setup"

set -g status-left-length 70
set -g status-right-length 90

# pane border
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour32

if-shell "test -f ~/.tmux.conf.local" "source ~/.tmux.conf.local"

run '~/.tmux/plugins/tpm/tpm'
