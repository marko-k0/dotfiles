# vim: ft=tmux

# common config
if-shell "test -f ~/.tmux.conf" "source ~/.tmux.conf.common"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10

run-shell "powerline-daemon -q"
source /usr/lib/python3.11/site-packages/powerline/bindings/tmux/powerline.conf

#set -g status-interval 2
#set -g status-justify "centre"
set -g status-left-length 70
set -g status-right-length 90

#set -g status-bg colour235 #base02
#set -g status-fg colour137 #yellow
#set -g status-attr default

# default window title colors
#setw -g window-status-fg colour244 #base0
#setw -g window-status-bg default
#setw -g window-status-attr dim

# active window title colors
#setw -g window-status-current-fg colour166 #orange
#setw -g window-status-current-bg default
#setw -g window-status-current-attr bright

# pane border
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour32

if-shell "test -f ~/.tmux.conf.local" "source ~/.tmux.conf.local"

run '~/.tmux/plugins/tpm/tpm'
